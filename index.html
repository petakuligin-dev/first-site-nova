<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="НоваТех — разработка сайтов, приложений и IT-систем для бизнеса. Прозрачные сроки, фиксированная стоимость, поддержка после запуска."
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>НоваТех — IT-разработка для бизнеса</title>
    <script>
      (function () {
        var key = 'novatech-theme';
        var theme = localStorage.getItem(key);
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <style>
      .noscript-warning {
        margin: 0;
        padding: 16px;
        text-align: center;
        background: #fef3c7;
        color: #92400e;
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <noscript>
      <p class="noscript-warning">
        Для работы сайта нужен JavaScript — включите его в настройках браузера.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
